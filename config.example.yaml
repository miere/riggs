# Riggs configuration. Copy to ~/.config/riggs/config.yaml and edit.
#
# Tokens are ${ENV} references, never literals: the secrets stay in the
# environment (Murtaugh's .env already exports these names).
#
# The ledger database is derived from this file's path and base name —
# ~/.config/riggs/config.yaml -> ~/.config/riggs/config.db.
version: 1

# The single human Riggs acts for: the Jira account tickets are assigned to, and
# the DM target when a tool is given no --slack-channel.
#
# There is deliberately NO github-login here. The reviewer handle goes on the
# command that fetches reviews (`riggs git pr --bulk <user>`), so the job says
# whose queue it mirrors. As a setting it was resolved at run time, which meant
# an edit to this file could repoint the queue at a different person while the
# scheduled job looked entirely unchanged. A config that still carries the key
# is refused at load, with a message saying so.
admin:
  slack-user-id: U0B20G0ET9T
  jira-email: miere@nurturecloud.com

# A dotenv file loaded before the ${VAR} references below are expanded.
#
# Required for `riggs launchd`: a launch agent inherits none of your shell
# environment, so without this every ${SLACK_...} expands to empty and the
# daemon starts up connected to nothing. Point it at Murtaugh's .env rather
# than duplicating the secrets.
#
# Omitted, `.env` beside this file is used if it exists — in the default setup
# that is ~/.config/riggs/.env. A file named here that cannot be read is an
# error. `riggs capabilities` prints whichever path was resolved.
#
# NOTE: these values OVERRIDE the ambient environment, which is the opposite of
# usual dotenv precedence. Murtaugh exports its own SLACK_BOT_TOKEN into every
# job it spawns, so without this Riggs would post as Murtaugh when scheduled and
# as itself when run by launchd — and the daemon would never hear the clicks.
# env-file: ~/.config/murtaugh/.env

# Each digest row offers up to four verbs, and every one of them is optional.
# Two ASK a person and stop; two RUN a local harness that does the work. They
# were one option for a long time — labelled "Ask for AI Assistance", tagging a
# colleague, starting nothing — which is the confusion these sections end.
#
# An option whose setting is absent is not rendered at all. A control that
# cannot act is worse than one that was never there.

# "Ask for Code Review" on a pull-request row. It drops one message and stops —
# nothing is delegated and no review is triggered; a human reads it and decides.
#
# There is no fallback to the admin. It had one while this was the only verb on
# the row; beside "Run Code Review" a menu entry that quietly means "send myself
# a card" reads as a bug next to one that does the work.
# review-request:
#   # Where the ask is posted. Omitted, it is DMed to the tagged user.
#   channel: C0B24F579T4
#   # Who is tagged. Omitted, the option is not offered.
#   user-id: U0B20G0ET9T
#   prompt: Could you take a look at this pull request when you get a chance?

# "Ask for SME Assistance" on a Jira digest row. Same shape, same guarantee, and
# deliberately SEPARATE settings: one asks a human to review code that exists,
# the other asks a subject-matter expert whether work that does not exist yet is
# worth picking up. They end up pointed at different channels and different
# people, and sharing a setting would mean changing one silently moved the
# other. Neither is ever defaulted from the other, or from the admin.
#
# It was spelled `ai-assistance` until the split. That key still loads and still
# means this; `riggs capabilities` says so, and renaming it is one edit.
# sme-assistance:
#   # Where the ask is posted. Omitted, it is DMed to the tagged user.
#   channel: C0B29C20Z9S
#   # Who is tagged. Omitted, the option is not offered.
#   user-id: U0B20G0ET9T
#   # {user} and {requester} are replaced with the corresponding mentions. A
#   # prompt that mentions neither still gets both: the recipient is prefixed
#   # and the requester appended as `c/c`, because those are the point of the
#   # feature and a wording change must not silently drop them. The default
#   # below places both itself, so it gets neither addition.
#   prompt: "{user}, {requester} needs your help check if this ticket is actionable as it is"

# "Run Code Review" and "Run AI Assistance": the local harness that actually
# does the work, on this machine, reporting back in the digest's thread.
#
# It holds no credential — the harness carries its own auth, exactly as `gh`
# does for GitHub. Omit `command` and neither option is offered.
# ai:
#   # The harness, with any fixed arguments. Split on whitespace, with no quote
#   # handling: an invocation needing more than that wants a wrapper script,
#   # which is one line and legible from the outside.
#   #
#   # A known harness (claude) gets its own prompt flag — `claude -p '<prompt>'`.
#   # Anything else is handed the prompt as its first argument.
#   command: claude
#
#   # Where it runs. This is the setting that decides whether the feature works
#   # at all: Claude Code reads the project it is standing in, and a launch
#   # agent inherits a working directory of `/`.
#   workdir: ${HOME}/Development
#
#   # What each run is asked to do. Both are editable from the App Home tab, and
#   # an absent one uses the built-in default — which is the point of leaving it
#   # absent, since a later change to the default then reaches this machine.
#   #
#   # {ref}/{key} and {url} become the item. A prompt naming neither still gets
#   # both appended: the wording is configuration, the subject is not, and a
#   # prompt edited to drop it would send the harness off to review whatever it
#   # found in the working directory and report success.
#   pull-request-prompt: Review the pull request {ref} ({url}). Leave your review as a comment.
#   ticket-prompt: Assess whether {key} ({url}) is actionable as written.
#
#   # How long one run may take. Bounded because this runs under a daemon nobody
#   # is watching, and a hung harness is indistinguishable from a thinking one.
#   timeout: 15m

# The Slack accounts Riggs may deliver through. A tool picks one with
# --slack-profile; with none given, the profile named "default" is used, and a
# missing "default" is an error rather than a silent no-op.
slack:
  profiles:
    default:
      bot-token: ${SLACK_BOT_TOKEN}
      # Optional. Only needed by tools that must post as Miere rather than as
      # the app.
      user-token: ${SLACK_USER_TOKEN}
      # Only needed on the profile `riggs daemon` listens as: the xapp- token
      # that opens the Socket Mode connection.
      # app-token: ${SLACK_APP_TOKEN}

    # Riggs' own Slack app: what the bulk digest is posted as, and what the
    # daemon listens as. Clicks on a message land in the app that posted it, so
    # the digest and the daemon must share one profile.
    #
    #   riggs daemon --slack-profile riggs
    #
    # riggs:
    #   bot-token: ${SLACK_RIGGS_BOT_TOKEN}
    #   app-token: ${SLACK_RIGGS_APP_TOKEN}

    # A second workspace, selected with --slack-profile nc.
    # nc:
    #   bot-token: ${SLACK_NC_BOT_TOKEN}

# Atlassian. All three are REQUIRED for the jira.* tools to be registered at
# all, and all three may be ${ENV} references — they fall back to the
# ATLASSIAN_* variables Murtaugh's .env already exports, so an existing machine
# needs nothing re-provisioned.
#
# base-url has no default. Riggs will not guess a tenant: a misconfigured
# machine quietly reading and assigning tickets on somebody else's Jira is worse
# than one that reads none. Without it the jira.* tools are simply absent, and
# `riggs capabilities` says so.
#
# It must be an absolute http(s) URL — a bare hostname is rejected at load
# rather than failing later as a puzzling bad request.
jira:
  email: ${ATLASSIAN_JIRA_EMAIL}
  token: ${ATLASSIAN_JIRA_TOKEN}
  base-url: ${ATLASSIAN_BASE_URL}
